<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Simulation-first Flutter portfolio by Shakyapurna Shakya.">
  <meta property="og:title" content="Shakyapurna | Simulation Portfolio">
  <meta property="og:description" content="Interactive simulation storytelling for engineering projects.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://shakyapurna.com.np">
  <meta property="og:image" content="https://shakyapurna.com.np/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shakyapurna | Simulation Portfolio">
  <meta name="twitter:description" content="Interactive simulation storytelling for engineering projects.">
  <meta name="twitter:image" content="https://shakyapurna.com.np/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Shakyapurna Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Shakyapurna | Simulation Portfolio</title>
  <link rel="manifest" href="manifest.json">

  <!-- Memory management configuration -->
  <script>
    // Configure CanvasKit memory limits to prevent crashes
    if ('CanvasKitInit' in window) {
      window.CanvasKitInit = window.CanvasKitInit || {};
      // Increase memory limit for complex simulations
      window.CanvasKitInit.multiple = 1.5;
    }
    
    // Set up memory monitoring
    window.addEventListener('load', function() {
      // Log memory usage periodically if available
      if ('memory' in performance) {
        setInterval(() => {
          const mem = performance.memory;
          if (mem.usedJSHeapSize > 0.8 * mem.jsHeapSizeLimit) {
            console.warn('High memory usage detected:', {
              used: (mem.usedJSHeapSize / 1024 / 1024).toFixed(2) + ' MB',
              limit: (mem.jsHeapSizeLimit / 1024 / 1024).toFixed(2) + ' MB',
              percentage: (mem.usedJSHeapSize / mem.jsHeapSizeLimit * 100).toFixed(2) + '%'
            });
          }
        }, 30000); // Check every 30 seconds
      }
    });
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
